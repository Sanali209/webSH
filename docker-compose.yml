services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./core:/app/core
      - ./plugins:/app/plugins
      - ./tests:/app/tests
    environment:
      - PYTHONUNBUFFERED=1
    command: uvicorn core.main:app --host 0.0.0.0 --port 8000 --reload

  redis:
    image: "redis:alpine"
    ports:
      - "6379:6379"
