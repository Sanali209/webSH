version: '3.8'

services:
  # Message Broker for Taskiq
  redis:
    image: redis:7-alpine
    container_name: websh-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # OpenTelemetry Collector
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: websh-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./infra/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    depends_on:
      - jaeger

  # Tracing Backend
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: websh-jaeger
    ports:
      - "16686:16686" # UI
      - "14268:14268" # HTTP trace ingestion
    restart: unless-stopped
