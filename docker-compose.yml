services:
  redis:
    image: redis:7-alpine
    container_name: pc_center_redis
    ports:
      - "6379:6379"
    restart: always

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: pc_center_jaeger
    ports:
      - "16686:16686" # UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    restart: always

  app:
    build: .
    container_name: pc_center_core
    ports:
      - "7860:7860"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - HOST=0.0.0.0
      - PORT=7860
    volumes:
      - ./plugins:/app/plugins
    depends_on:
      - redis
      - jaeger
    restart: always
