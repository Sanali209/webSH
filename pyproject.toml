[tool.poetry]
name = "pc-center"
version = "0.1.0"
description = "A modular local 'Web OS' application with a Python backend and Svelte frontend."
authors = ["Jules <jules@example.com>"]
readme = "README.md"
packages = [{include = "core"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.110.0"
uvicorn = "^0.27.0"
pluggy = "^1.4.0"
taskiq = "^0.11.0"
loguru = "^0.7.2"
pydantic = "^2.6.0"
websockets = "^12.0"
python-multipart = "^0.0.9"
lancedb = "^0.29.1"
pyarrow = "^23.0.0"
pandas = "^3.0.0"
polars = "^1.38.1"
watchdog = "^4.0.0"
psutil = "^5.9.0"


[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
httpx = "^0.27.0"
black = "^24.2.0"
isort = "^5.13.0"
mypy = "^1.8.0"
pytest-cov = "^7.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
